name: Bug
description: Something behaves differently from what the code or docs say it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For a security problem, do not use this form. See [SECURITY.md](https://github.com/backspring-labs/guiderail/blob/main/SECURITY.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happens, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The shortest sequence that shows it. Include the perspective, the selection, and what you clicked or pressed.
      placeholder: |
        1. Open the app
        2. Switch to the Sequence perspective
        3. ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Error text, a screenshot, or the file and line if you traced it in code.
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: "main at 38a7805, or 0.7.1"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node version, browser and OS, where relevant.
      placeholder: "Node 26.10, Chrome 131, macOS"
