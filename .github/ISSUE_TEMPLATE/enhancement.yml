name: Enhancement
description: A change to what GuideRail does for the people using it.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        An enhancement is a proposal until the maintainer triages it. Documents under `docs/ideas/` are not approved work.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs this and what they cannot do today.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What is true when this is done, from the user's side.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: What is included, and what is deliberately left out.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: Checkable statements. Each one needs evidence before the issue closes.
      placeholder: |
        - [ ] ...
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Issues that must land first, and decisions that are still open.
