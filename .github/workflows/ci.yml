name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default. Fork pull requests run with this same token and no secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Supported lines: 26 is the primary runtime (.node-version), 24 is kept compatible.
        node: [24, 26]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Record toolchain
        run: |
          echo "node $(node --version)"
          echo "pnpm $(pnpm --version)"
          {
            echo "### Toolchain (Node ${{ matrix.node }} line)"
            echo "- node $(node --version)"
            echo "- pnpm $(pnpm --version)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint (root and workspaces)
        run: pnpm exec biome ci .

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Package check (packed core installs and resolves outside the workspace)
        run: pnpm check:package

  # Fails a pull request that adds a dependency with a known high or critical
  # vulnerability. It compares the pull request against its base, so it has
  # nothing to do on a push to main.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  # The single check that branch protection requires. It fails unless every job
  # above succeeded, so a cancelled or skipped job can never read as a pass.
  # The one allowed skip is dependency review on a push, where it does not apply.
  gate:
    name: CI gate
    if: always()
    needs: [checks, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"' | tee -a "$GITHUB_STEP_SUMMARY"
          echo "$NEEDS" | jq -e --arg event "$EVENT" '
            to_entries | all(
              .value.result == "success"
              or (.key == "dependency-review" and $event != "pull_request" and .value.result == "skipped")
            )' > /dev/null
