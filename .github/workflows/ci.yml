name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default. Fork pull requests run with this same token and no secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Supported lines: 26 is the primary runtime (.node-version), 24 is kept compatible.
        node: [24, 26]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Record toolchain
        run: |
          echo "node $(node --version)"
          echo "pnpm $(pnpm --version)"
          {
            echo "### Toolchain (Node ${{ matrix.node }} line)"
            echo "- node $(node --version)"
            echo "- pnpm $(pnpm --version)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Warnings fail too. The repository keeps complexity and style warnings at zero,
      # and a warning that does not fail the gate is one nobody sees.
      - name: Lint (root and workspaces, warnings are errors)
        run: pnpm exec biome ci --error-on-warnings .

      - name: Dependency boundaries (web -> core only, kernel free of UI and demo data)
        run: pnpm check:boundaries

      - name: Build
        run: pnpm build

      - name: Typecheck (tests, fixtures and config files, no emit)
        run: pnpm typecheck

      - name: Test with coverage thresholds
        run: pnpm test:coverage

      - name: Package check (packed core installs and resolves outside the workspace)
        run: pnpm check:package

  # Runs the production build in a real browser. Kept small on purpose: it proves
  # the artifact users run actually opens and that kernel and view agree.
  smoke:
    name: Browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node (primary line, from .node-version)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @guiderail/web exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Smoke test against the production build
        run: pnpm --filter @guiderail/web test:e2e

      - name: Keep failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-smoke-failure
          path: |
            apps/web/test-results
            apps/web/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  # Fails a pull request that adds a dependency with a known high or critical
  # vulnerability. It compares the pull request against its base, so it has
  # nothing to do on a push to main.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  # The single check that branch protection requires. It fails unless every job
  # above succeeded, so a cancelled or skipped job can never read as a pass.
  # The one allowed skip is dependency review on a push, where it does not apply.
  gate:
    name: CI gate
    if: always()
    needs: [checks, smoke, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"' | tee -a "$GITHUB_STEP_SUMMARY"
          echo "$NEEDS" | jq -e --arg event "$EVENT" '
            to_entries | all(
              .value.result == "success"
              or (.key == "dependency-review" and $event != "pull_request" and .value.result == "skipped")
            )' > /dev/null
