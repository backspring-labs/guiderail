name: Release check

# Runs when a version tag is pushed. It publishes nothing: it verifies that the
# tag points at a commit on main that passed the CI gate, that both packages
# carry the tag's version, and that the changelog has notes for it. The result
# is a public record that the tag was checked. See docs/releasing.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  checks: read

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node (primary line, from .node-version)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Verify the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: node scripts/check-release.mjs --tag "$TAG"
