version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Type declarations track the lowest supported Node line (24), so code
      # cannot rely on APIs missing there. Raise this with the support policy.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Major upgrades deferred to issue #46. Remove each entry when it is done.
      - dependency-name: "storybook"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@storybook/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # All security fixes arrive as one pull request.
      security:
        applies-to: security-updates
        patterns: ["*"]
      # The test stack moves together, majors included. Vitest and its coverage
      # provider must be on the same version, and jest-dom supports only the
      # current Vitest major (#100). Listed before the groups below because a
      # dependency joins the first group it matches.
      test-stack:
        applies-to: version-updates
        patterns: ["vitest", "@vitest/*", "@testing-library/jest-dom"]
      # Routine minor and patch updates, split by where the dependency runs.
      # Major versions arrive as individual pull requests.
      runtime:
        applies-to: version-updates
        dependency-type: production
        update-types: [minor, patch]
      dev-tooling:
        applies-to: version-updates
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
